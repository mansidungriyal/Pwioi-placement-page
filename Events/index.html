<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Events — PW Institute of Innovation</title>
<meta name="description" content="Masterclasses, workshops, hackathons and open houses at PW Institute of Innovation. Register for what's next, or browse what we've already run.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   1. THEME TOKENS — change these to match the rest of the site
   ============================================================ */
:root{
  --ink:#14121f;
  --ink-soft:#57536b;
  --ink-faint:#8a86a0;
  --line:#e7e5ef;
  --surface:#ffffff;
  --canvas:#faf9fd;
  --brand:#2847b5;
  --brand-dark:#1e3690;
  --brand-wash:#eaeefb;
  --live:#e0342c;

  --font-display:'Sora',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;

  --radius:16px;
  --shadow:0 1px 2px rgba(20,18,31,.04),0 12px 28px -18px rgba(20,18,31,.18);
  --shadow-lift:0 2px 4px rgba(20,18,31,.05),0 22px 44px -22px rgba(20,18,31,.28);
}

/* ============================================================
   2. BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
body{margin:0}

.ev{
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--canvas);
  -webkit-font-smoothing:antialiased;
  line-height:1.55;
}
.ev :where(h1,h2,h3){font-family:var(--font-display);line-height:1.15;letter-spacing:-.02em;margin:0}
.ev p{margin:0}
.ev img{display:block;max-width:100%}
.ev a{color:inherit}
.ev__wrap{max-width:1140px;margin:0 auto;padding:0 24px}

.ev__eyebrow{
  font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--brand);margin:0 0 12px;
}

/* ---- page head ---- */
.ev__head{padding:64px 0 4px}
.ev__head h1{font-size:clamp(36px,5.6vw,56px);font-weight:700}
.ev__lede{max-width:58ch;margin:16px 0 0;color:var(--ink-soft);font-size:17px}

/* ---- sections ---- */
.ev__section{padding:36px 0 56px}
.ev__section-head{margin-bottom:28px}
.ev__section-head h2{
  display:inline-flex;align-items:center;gap:9px;
  padding:13px 24px;border-radius:10px;
  background:var(--brand);color:#fff;
  font-size:15px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
}
.ev__count{
  padding:2px 8px;border-radius:99px;
  background:rgba(255,255,255,.22);color:#fff;
  font-family:var(--font-body);font-size:12px;font-weight:600;letter-spacing:0;
}
.ev__section--past{background:var(--surface);border-top:1px solid var(--line)}

/* ============================================================
   3. CARDS
   ============================================================ */
.ev__grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fill,minmax(318px,1fr))}
.ev__grid--past{gap:20px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}

.card{
  display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
  transition:transform .25s cubic-bezier(.2,.7,.3,1),box-shadow .25s;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}

.card__banner{
  position:relative;aspect-ratio:16/9;overflow:hidden;
  background:linear-gradient(135deg,var(--brand-wash),#fff);
}
/* Creatives are often square or portrait. Rather than cropping the artwork,
   fit the whole thing and fill the gaps with a blurred copy of itself. */
.card__banner-bg{
  position:absolute;inset:0;z-index:0;
  background-size:cover;background-position:center;
  filter:blur(20px) brightness(.82) saturate(1.15);transform:scale(1.15);
}
.card__banner img{
  position:relative;z-index:1;width:100%;height:100%;object-fit:contain;
}
/* keeps the date tab readable no matter what artwork sits behind it */
.card__banner::after{
  content:"";position:absolute;inset:auto 0 0 0;height:42%;z-index:2;pointer-events:none;
  background:linear-gradient(to top,rgba(20,18,31,.36),transparent);
}
.card__banner--empty{
  background:linear-gradient(135deg,var(--brand-wash),#fff);
}
.card__banner--empty::after{display:none}
.banner-tag{
  position:absolute;top:12px;right:14px;z-index:3;
  font-family:var(--font-display);font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--brand);
}

/* signature: the date tab sitting on the banner */
.datetab{
  position:absolute;left:14px;bottom:14px;z-index:3;
  min-width:52px;padding:7px 9px 8px;border-radius:11px;
  background:rgba(255,255,255,.96);backdrop-filter:blur(6px);
  box-shadow:0 6px 18px -8px rgba(20,18,31,.45);
  text-align:center;font-family:var(--font-display);
}
.datetab b{display:block;font-size:21px;line-height:1;color:var(--ink)}
.datetab span{
  display:block;margin-top:3px;font-size:10px;font-weight:700;
  letter-spacing:.09em;color:var(--brand-dark);
}

.card__body{display:flex;flex-direction:column;gap:12px;padding:20px;flex:1}

.pill-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:99px;
  font-size:12px;font-weight:600;letter-spacing:.02em;
  background:var(--brand-wash);color:var(--brand-dark);
}
.pill--quiet{background:#f4f3f8;color:var(--ink-soft)}
.pill--soon{background:#fff4e5;color:#9a5b00}
.pill--live{background:var(--live);color:#fff}
.pill--live::before{
  content:"";width:6px;height:6px;border-radius:50%;background:#fff;
  animation:blip 1.4s ease-in-out infinite;
}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}

.card__title{font-size:18px}
.card__desc{color:var(--ink-soft);font-size:14.5px}

.meta{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--ink-soft)}
.meta div{display:flex;gap:8px;align-items:flex-start}
.meta svg{flex:0 0 15px;margin-top:2px;color:var(--ink-faint)}

.speaker{display:flex;gap:11px;align-items:center;padding-top:14px;border-top:1px solid var(--line)}
.speaker__pic,.speaker__ini{width:38px;height:38px;border-radius:50%;flex:0 0 38px}
.speaker__pic{object-fit:cover}
.speaker__ini{
  display:grid;place-items:center;background:var(--brand-wash);
  color:var(--brand-dark);font-family:var(--font-display);font-size:13px;font-weight:700;
}
.speaker__name{font-size:14px;font-weight:600}
.speaker__role{font-size:12.5px;color:var(--ink-faint)}

.card__actions{display:flex;gap:10px;align-items:center;margin-top:auto;padding-top:16px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 18px;border-radius:10px;border:1px solid transparent;
  font-family:var(--font-body);font-size:14px;font-weight:600;
  text-decoration:none;cursor:pointer;transition:background .18s,border-color .18s,color .18s;
}
.btn--primary{background:var(--brand);color:#fff;flex:1}
.btn--primary:hover{background:var(--brand-dark)}
.btn--ghost{background:transparent;border-color:var(--line);color:var(--ink-soft)}
.btn--ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn--icon{padding:11px;flex:0 0 auto}

/* ---- featured ---- */
.featured{
  display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);
  background:var(--surface);border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:26px;
}
.featured .card__banner{aspect-ratio:auto;height:100%;min-height:280px}
.featured__body{display:flex;flex-direction:column;gap:14px;padding:34px}
.featured__body .card__title{font-size:clamp(22px,2.6vw,29px)}
.featured__body .card__desc{font-size:15.5px}
@media(max-width:820px){
  .featured{grid-template-columns:1fr}
  .featured .card__banner{aspect-ratio:16/9;min-height:0}
  .featured__body{padding:24px}
}

/* ---- past cards: archive treatment ---- */
.card--past .card__banner img{filter:saturate(.6);transition:filter .3s}
.card--past:hover .card__banner img{filter:saturate(1)}
.card--past .card__body{gap:8px;padding:16px 18px 18px}
.card--past .card__title{font-size:16px}

/* ============================================================
   4. STATES
   ============================================================ */
.empty{padding:52px 20px 64px;text-align:center}
.empty p{color:var(--ink-soft);font-size:17px}
.empty .btn{margin-top:20px;display:inline-flex}

.skel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.skel__banner{aspect-ratio:16/9}
.skel__body{padding:20px;display:flex;flex-direction:column;gap:11px}
.skel__line{height:12px;border-radius:6px}
.skel__banner,.skel__line{
  background:linear-gradient(100deg,#efedf5 32%,#f8f7fb 50%,#efedf5 68%);
  background-size:220% 100%;animation:shimmer 1.4s linear infinite;
}
@keyframes shimmer{to{background-position:-120% 0}}

@media(prefers-reduced-motion:reduce){
  .ev *,.ev *::before{animation:none!important;transition:none!important}
  .card:hover{transform:none}
}
.ev :where(a,button):focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
</style>
</head>

<body>
<main class="ev">

  <header class="ev__head">
    <div class="ev__wrap">
      <p class="ev__eyebrow">Campus &amp; Community</p>
      <h1>Events at PW IOI</h1>
      <p class="ev__lede">Masterclasses with industry practitioners, build weekends, and open houses.
        Register for what's next, or look through what we've already run.</p>
    </div>
  </header>

  <section class="ev__section" aria-labelledby="ev-upcoming-h">
    <div class="ev__wrap">
      <div class="ev__section-head">
        <h2 id="ev-upcoming-h">Upcoming events <span class="ev__count" id="ev-upcoming-count" hidden></span></h2>
      </div>
      <div id="ev-featured"></div>
      <div class="ev__grid" id="ev-upcoming" aria-busy="true"></div>
    </div>
  </section>

  <section class="ev__section ev__section--past" aria-labelledby="ev-past-h">
    <div class="ev__wrap">
      <div class="ev__section-head">
        <h2 id="ev-past-h">Previous events <span class="ev__count" id="ev-past-count" hidden></span></h2>
      </div>
      <div class="ev__grid ev__grid--past" id="ev-past" aria-busy="true"></div>
    </div>
  </section>

  <p class="sr" id="ev-status" role="status" aria-live="polite"></p>
</main>

<script>
(function () {
  'use strict';

  /* ====== 1. CONFIG — paste your Apps Script /exec URL here ====== */
  var FEED_URL = 'https://script.google.com/macros/s/AKfycbyQxIcr_fnjPn769VNUbJAHRjXkRt-AxkPkoC3iSBK4IWQp8Syf3hZq1d9CtMfPwBrc/exec';

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    featured: $('ev-featured'),
    upcoming: $('ev-upcoming'),
    past: $('ev-past'),
    upCount: $('ev-upcoming-count'),
    pastCount: $('ev-past-count'),
    status: $('ev-status')
  };

  /* ====== 2. UTIL ====== */
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function initials(name) {
    return String(name || '').trim().split(/\s+/).slice(0, 2)
      .map(function (w) { return w.charAt(0).toUpperCase(); }).join('') || '·';
  }

  function icon(path) {
    return '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" ' +
           'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
           path + '</svg>';
  }
  var ICONS = {
    clock: icon('<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/>'),
    pin: icon('<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1116 0z"/><circle cx="12" cy="10" r="2.6"/>'),
    cal: icon('<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3 10h18"/>')
  };

  /* ====== 3. TIME ====== */
  var MINUTE = 60000;

  function countdownPill(ev) {
    var start = new Date(ev.start_iso).getTime();
    var end = new Date(ev.end_iso).getTime();
    var now = Date.now();

    if (now >= start && now <= end) return '<span class="pill pill--live">Live now</span>';

    var mins = Math.round((start - now) / MINUTE);
    if (mins < 0 || mins > 60 * 24 * 10) return '';
    if (mins < 60) return '<span class="pill pill--soon">Starts in ' + Math.max(mins, 1) + ' min</span>';

    var hours = Math.round(mins / 60);
    if (hours < 24) return '<span class="pill pill--soon">Starts in ' + hours + ' hr</span>';

    var days = Math.round(hours / 24);
    return '<span class="pill pill--soon">In ' + days + ' day' + (days === 1 ? '' : 's') + '</span>';
  }

  /** Builds an .ics file as a data URI so "Add to calendar" needs no backend. */
  function icsHref(ev) {
    var stamp = function (iso) {
      return new Date(iso).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
    };
    var fold = function (s) { return String(s).replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n'); };
    var lines = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//PW IOI//Events//EN', 'BEGIN:VEVENT',
      'UID:' + ev.id + '@pwioi.co.in',
      'DTSTAMP:' + stamp(new Date().toISOString()),
      'DTSTART:' + stamp(ev.start_iso),
      'DTEND:' + stamp(ev.end_iso),
      'SUMMARY:' + fold(ev.title),
      'LOCATION:Online',
      ev.register_url ? 'URL:' + ev.register_url : '',
      'END:VEVENT', 'END:VCALENDAR'
    ].filter(Boolean);
    return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(lines.join('\r\n'));
  }

  /* ====== 4. CARD PARTS ====== */
  function banner(ev) {
    var tab = '<div class="datetab"><b>' + esc(ev.day) + '</b><span>' + esc(ev.month) + '</span></div>';
    if (ev.banner_url) {
      var src = esc(ev.banner_url);
      return '<div class="card__banner">' +
               '<div class="card__banner-bg" style="background-image:url(&quot;' + src + '&quot;)"></div>' +
               '<img src="' + src + '" alt="" loading="lazy" decoding="async"' +
                    (ev.banner_file_id ? ' data-file-id="' + esc(ev.banner_file_id) + '"' : '') + '>' +
               tab +
             '</div>';
    }
    return '<div class="card__banner card__banner--empty">' + tab +
           '<span class="banner-tag">PW IOI</span></div>';
  }

  function pills(ev, extra) {
    return '<div class="pill-row">' + (extra || '') + '</div>';
  }

  function metaRows(ev) {
    return '<div class="meta"><div>' + ICONS.clock +
           '<span>' + esc(ev.date_label) + ' · ' + esc(ev.time_label) + '</span></div></div>';
  }

  function actions(ev) {
    if (!ev.register_url) return '';
    return '<div class="card__actions">' +
      '<a class="btn btn--primary" href="' + esc(ev.register_url) + '" target="_blank" rel="noopener">' +
        'Register' +
      '</a>' +
      '<a class="btn btn--ghost btn--icon" href="' + esc(icsHref(ev)) + '" ' +
        'download="' + esc(ev.id) + '.ics" title="Add to calendar" aria-label="Add ' +
        esc(ev.title) + ' to calendar">' + ICONS.cal + '</a>' +
    '</div>';
  }

  /* ====== 5. CARD TEMPLATES ====== */
  function upcomingCard(ev) {
    return '<article class="card" data-start="' + esc(ev.start_iso) + '" data-end="' + esc(ev.end_iso) + '">' +
      banner(ev) +
      '<div class="card__body">' +
        pills(ev, countdownPill(ev)) +
        '<h3 class="card__title">' + esc(ev.title) + '</h3>' +
        metaRows(ev) +
        actions(ev) +
      '</div>' +
    '</article>';
  }

  function featuredCard(ev) {
    return '<article class="featured">' +
      banner(ev) +
      '<div class="featured__body">' +
        pills(ev, countdownPill(ev)) +
        '<h3 class="card__title">' + esc(ev.title) + '</h3>' +
        metaRows(ev) +
        actions(ev) +
      '</div>' +
    '</article>';
  }

  /* Past cards stay deliberately bare: banner, title, and when it ran. */
  function pastCard(ev) {
    return '<article class="card card--past">' +
      banner(ev) +
      '<div class="card__body">' +
        '<h3 class="card__title">' + esc(ev.title) + '</h3>' +
        '<div class="meta"><div>' + ICONS.clock +
          '<span>' + esc(ev.date_label) + ' · ' + esc(ev.time_label) + '</span>' +
        '</div></div>' +
      '</div>' +
    '</article>';
  }

  /* ====== 5b. BANNER DELIVERY ======
     Banners load from Google's CDN, which is fast and free. If that is blocked —
     Workspace policy, or a CDN change — ask the Apps Script for the bytes
     instead. Only if both routes fail does the card fall back to a gradient. */

  function paintBanner(img, src) {
    img.src = src;
    var bg = img.previousElementSibling;
    if (bg && bg.classList.contains('card__banner-bg')) {
      bg.style.backgroundImage = 'url("' + src + '")';
    }
  }

  function dropBanner(img) {
    var frame = img.parentNode;
    var bg = img.previousElementSibling;
    if (bg && bg.classList.contains('card__banner-bg')) bg.remove();
    img.remove();
    // leave the card looking identical to one that never had a banner
    if (frame && !frame.querySelector('.banner-tag')) {
      frame.classList.add('card__banner--empty');
      frame.insertAdjacentHTML('afterbegin',
        '<span class="banner-tag">PW IOI</span>');
    }
  }

  function retryBanner(img) {
    var id = img.getAttribute('data-file-id');
    if (!id || img.getAttribute('data-retried')) return dropBanner(img);
    img.setAttribute('data-retried', '1');

    var url = FEED_URL + (FEED_URL.indexOf('?') > -1 ? '&' : '?') + 'img=' + encodeURIComponent(id);

    fetch(url)
      .then(function (r) { return r.text(); })
      .catch(function () { return jsonp(url); })
      .then(function (data) {
        if (typeof data === 'string' && data.indexOf('data:image/') === 0) paintBanner(img, data);
        else dropBanner(img);
      })
      .catch(function () { dropBanner(img); });
  }

  function wireBanners(root) {
    root.querySelectorAll('.card__banner img').forEach(function (img) {
      img.addEventListener('error', function () { retryBanner(img); });
      // an image that already failed fires no further event
      if (img.complete && img.naturalWidth === 0) retryBanner(img);
    });
  }

  /* ====== 6. STATES ====== */
  function skeletons(n, cls) {
    var one = '<div class="skel ' + (cls || '') + '"><div class="skel__banner"></div>' +
      '<div class="skel__body">' +
        '<div class="skel__line" style="width:38%"></div>' +
        '<div class="skel__line" style="width:88%;height:16px"></div>' +
        '<div class="skel__line" style="width:64%"></div>' +
      '</div></div>';
    return new Array(n).fill(one).join('');
  }

  var NO_EVENTS = 'Sorry! There are no events at the moment';

  function emptyState(message, cta) {
    return '<div class="empty" style="grid-column:1/-1"><p>' + esc(message) + '</p>' +
      (cta || '') + '</div>';
  }

  /* ====== 7. SEO: Event structured data for the upcoming list ====== */
  function injectSchema(list) {
    if (!list.length) return;
    var graph = list.map(function (ev) {
      var node = {
        '@type': 'Event',
        name: ev.title,
        startDate: ev.start_iso,
        endDate: ev.end_iso,
        eventStatus: 'https://schema.org/EventScheduled',
        eventAttendanceMode: 'https://schema.org/OnlineEventAttendanceMode',
        organizer: { '@type': 'Organization', name: 'PW Institute of Innovation', url: 'https://pwioi.co.in' }
      };
      if (ev.banner_url) node.image = [ev.banner_url];
      if (ev.register_url) node.url = ev.register_url;
      node.location = { '@type': 'VirtualLocation',
                        url: ev.register_url || 'https://pwioi.co.in/events' };
      return node;
    });

    var tag = document.createElement('script');
    tag.type = 'application/ld+json';
    tag.textContent = JSON.stringify({ '@context': 'https://schema.org', '@graph': graph });
    document.head.appendChild(tag);
  }

  /* ====== 8. RENDER ====== */
  function render(data) {
    var upcoming = data.upcoming || [];
    var past = data.past || [];

    var featured = null;
    for (var i = 0; i < upcoming.length; i++) {
      if (upcoming[i].is_featured) { featured = upcoming.splice(i, 1)[0]; break; }
    }

    els.featured.innerHTML = featured ? featuredCard(featured) : '';

    els.upcoming.innerHTML = upcoming.length
      ? upcoming.map(upcomingCard).join('')
      : (featured ? '' : emptyState(NO_EVENTS));

    els.past.innerHTML = past.length
      ? past.map(pastCard).join('')
      : emptyState(NO_EVENTS);

    [els.featured, els.upcoming, els.past].forEach(wireBanners);

    setCount(els.upCount, upcoming.length + (featured ? 1 : 0));
    setCount(els.pastCount, past.length);

    els.upcoming.setAttribute('aria-busy', 'false');
    els.past.setAttribute('aria-busy', 'false');
    els.status.textContent = (upcoming.length + (featured ? 1 : 0)) + ' upcoming and ' +
      past.length + ' past events loaded.';

    injectSchema(featured ? [featured].concat(upcoming) : upcoming);
    startTicker();
  }

  function setCount(el, n) {
    if (!n) { el.hidden = true; return; }
    el.hidden = false;
    el.textContent = n;
  }

  /** Refreshes "Live now" / "Starts in…" pills without refetching. */
  var ticker;
  function startTicker() {
    clearInterval(ticker);
    ticker = setInterval(function () {
      document.querySelectorAll('.card[data-start], .featured').forEach(function (card) {
        var row = card.querySelector('.pill-row');
        var start = card.getAttribute('data-start');
        if (!row || !start) return;
        var fresh = countdownPill({ start_iso: start, end_iso: card.getAttribute('data-end') });
        var existing = row.querySelector('.pill--soon, .pill--live');
        if (existing && !fresh) existing.remove();
        else if (existing && fresh) existing.outerHTML = fresh;
        else if (fresh) row.insertAdjacentHTML('afterbegin', fresh);
      });
    }, MINUTE);
  }

  function showError() {
    els.upcoming.setAttribute('aria-busy', 'false');
    els.past.setAttribute('aria-busy', 'false');
    els.featured.innerHTML = '';
    els.past.innerHTML = '';
    els.upcoming.innerHTML = emptyState(
      "Events couldn't be loaded just now",
      '<button class="btn btn--primary" type="button" id="ev-retry">Try again</button>'
    );
    var retry = $('ev-retry');
    if (retry) retry.addEventListener('click', load);
  }

  /* ====== 9. LOAD (fetch, with a JSONP fallback if CORS misbehaves) ====== */
  function jsonp(url) {
    return new Promise(function (resolve, reject) {
      var name = '__evcb' + Date.now();
      var tag = document.createElement('script');
      var timer = setTimeout(function () { cleanup(); reject(new Error('timeout')); }, 12000);

      function cleanup() {
        clearTimeout(timer);
        delete window[name];
        if (tag.parentNode) tag.parentNode.removeChild(tag);
      }
      window[name] = function (data) { cleanup(); resolve(data); };
      tag.onerror = function () { cleanup(); reject(new Error('jsonp failed')); };
      tag.src = url + (url.indexOf('?') > -1 ? '&' : '?') + 'callback=' + name;
      document.head.appendChild(tag);
    });
  }

  function load() {
    els.featured.innerHTML = '';
    els.upcoming.innerHTML = skeletons(3);
    els.past.innerHTML = skeletons(4);
    els.upcoming.setAttribute('aria-busy', 'true');
    els.past.setAttribute('aria-busy', 'true');

    fetch(FEED_URL, { redirect: 'follow' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .catch(function () { return jsonp(FEED_URL); })
      .then(render)
      .catch(showError);
  }

  if (/PASTE_YOUR/.test(FEED_URL)) {
    els.upcoming.innerHTML = emptyState(
      'Feed URL not set — open events.html and replace FEED_URL with your Apps Script /exec URL.');
    els.past.innerHTML = '';
  } else {
    load();
  }
})();
</script>
